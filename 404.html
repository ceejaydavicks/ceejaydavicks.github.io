<!doctype html>

  <script>
    (function () {
      var theme = "dark";
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") theme = saved;
        else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
      } catch (_) {}
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="/assets/preloader.css">
  <link rel="stylesheet" href="/assets/legal.css">
  <style>
    .not-found { min-height: 54vh; display: grid; align-content: center; text-align: center; }

    .not-found p { color: var(--muted); }
    .not-found .home-link { display: inline-block; margin-top: 1rem; font-weight: 600; }
  </style>
</head>
<body>

    </div>

  <main class="not-found">
    <p class="eyebrow">404 · Page not found</p>

    </div>
  </footer>
  <script>document.getElementById("year").textContent = String(new Date().getFullYear());</script>
</body>
</html>
