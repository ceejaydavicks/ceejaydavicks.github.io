  <!-- THEME BOOTSTRAP: runs before the stylesheet so the right theme paints first.
       Saved choice wins; otherwise the device setting decides; dark is the default. -->
  <script>
    (function () {
      var theme = "dark";
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") theme = saved;
        else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
      } catch (error) {
        if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
      }

      document.documentElement.setAttribute("data-theme", theme);

      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "light" ? "#F7F7FA" : "#0B0B0F");

      var preload = document.createElement("link");
      preload.setAttribute("rel", "preload");
      preload.setAttribute("as", "image");
      preload.href = theme === "light" ? "./assets/logo-lockup-light@3x.png" : "./assets/logo-lockup@3x.png";
      preload.setAttribute("fetchpriority", "high");
      document.head.appendChild(preload);
    })();
  </script>

  <script type="module">
    /* ================================================================
       CONFIG — edit these three values only
       ================================================================ */

    // Visible branding + SEO title/meta follow this value.
    let SITE_NAME = "BootyMansion";

    // TELEGRAM: paste your full channel link, e.g. "https://t.me/yourchannel".
    // Leave it empty until you have the link; every Telegram button is rendered
    // but stays inactive (and says so on hover) instead of linking nowhere.
    let TELEGRAM_URL = "";

    // ADVERTISING — one config object drives every ad slot on the page.
    // Paste the ad snippet (Adsterra or any network) as a string. A slot with an
    // empty `code` is removed completely: no placeholder box, no reserved space.
    //   banner    – responsive banner between Shorts and Latest (300x250 on
    //               phones, 728x90 on desktop).
    //   native    – one native card inside the feed, after every `every` videos.
    //   smartlink – the single "Sponsored" card in the feed; set `url` for a
    //               text card or `code` for an image/banner card.
    const AD_CONFIG = {
      banner: {
        label: "Advertisement",
        code: ""
      },
      native: {
        label: "Advertisement",
        every: 8,
        code: ""
      },
      smartlink: {
        label: "Sponsored",
        url: "",
        code: ""
      }
    };

    /* ================================================================
       ICONS (inline SVG — no icon-library download)
       ================================================================ */
    const ICONS = {
      play: '<path d="M7 4.8c0-.7.8-1.1 1.4-.7l11 7.2a.9.9 0 0 1 0 1.4l-11 7.2c-.6.4-1.4 0-1.4-.7V4.8Z"/>',
      bookmark: '<path d="M6.5 4.5h11a1 1 0 0 1 1 1v14l-6.5-4-6.5 4v-14a1 1 0 0 1 1-1Z"/>',
      share: '<circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="m8.3 10.7 7.4-4.2M8.3 13.3l7.4 4.2"/>',
      external: '<path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5.5H4.5V6H10"/>',
      badge: '<path d="m9 12.5 2.2 2.2L15.5 10"/><path d="M12 3.2l2.2 1.6 2.7-.2 1 2.5 2.2 1.6-.8 2.6.8 2.6-2.2 1.6-1 2.5-2.7-.2L12 19.4l-2.2-1.6-2.7.2-1-2.5-2.2-1.6.8-2.6-.8-2.6 2.2-1.6 1-2.5 2.7.2L12 3.2Z"/>'
    };

    const svg = (name, cls = "icon") =>
      `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${ICONS[name] || ""}</svg>`;

    /* ================================================================
       HELPERS
       ================================================================ */
    const $ = (selector, root = document) => root.querySelector(selector);

    const esc = (value) =>
      String(value == null ? "" : value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[character]));

    const clean = (value) => {
      if (typeof value !== "string") return "";
      const trimmed = value.trim();
      return trimmed ? trimmed : "";
    };

    const safeUrl = (value) => {
      const candidate = clean(value);
      if (!candidate) return "";
      try {
        const parsed = new URL(candidate, window.location.href);
        return ["http:", "https:"].includes(parsed.protocol) ? parsed.href : "";
      } catch (error) {
        return "";
      }
    };

    const formatDuration = (seconds) => {
      if (!Number.isFinite(seconds) || seconds <= 0) return "";
      const total = Math.round(seconds);
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const secs = String(total % 60).padStart(2, "0");
      return hours ? `${hours}:${String(minutes).padStart(2, "0")}:${secs}` : `${minutes}:${secs}`;
    };

    const plural = (count) => (count === 1 ? "" : "s");

    const tone = (index) => ["244, 63, 94", "225, 29, 72", "251, 113, 133", "190, 18, 60", "253, 164, 175"][index % 5];

    function toast(message) {
      const node = $("#toast");
      if (!node) return;
      node.textContent = message;
      node.classList.add("is-visible");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => node.classList.remove("is-visible"), 2600);
    }

    /* ================================================================
       VIDEO DATA — served by /api/videos (D1, managed from /admin)
       ================================================================ */
    const API_TIMEOUT = 7000;

    /* ================================================================
       ONE CATALOGUE
       ================================================================
       /api/videos returns every video the site knows about: the ones added
       in /admin and the ones published through the Telegram bot (the bot's
       own catalogue is mirrored into the same database on the server, so
       the admin panel and this page always read the same rows).
       ================================================================ */

    async function fetchJson(url) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), API_TIMEOUT);
      try {
        const response = await fetch(url, {
          headers: { accept: "application/json" },
          credentials: "same-origin",
          signal: controller.signal
        });
        if (!response.ok) throw new Error(`${url} responded ${response.status}`);
        return await response.json();
      } finally {
        clearTimeout(timer);
      }
    }

    let rawVideos = [];
    let apiLive = false;
    let siteSettings = null;

    // Both calls run in parallel; one failing never blocks the other.
    const [videosResult, settingsResult] = await Promise.allSettled([
      fetchJson("/api/videos"),
      fetchJson("/api/settings")
    ]);

    if (videosResult.status === "fulfilled") {
      const payload = videosResult.value || {};
      rawVideos = Array.isArray(payload.videos) ? payload.videos : [];
      apiLive = true;
    } else {
      console.warn("Video API unavailable — falling back to the bundled samples.", videosResult.reason);
    }

    if (settingsResult.status === "fulfilled") {
      siteSettings = (settingsResult.value && settingsResult.value.settings) || null;
    }

    // Without a backend (GitHub Pages, a static preview) the bundled samples keep
    // the layout working. When the API *is* live but empty we show the empty
    // state, never fake cards.
    if (!apiLive) {
      try {
        ({ videos: rawVideos } = await import("./videos.js"));
      } catch (error) {
        console.warn("videos.js could not be loaded:", error);
        rawVideos = [];
      }
    }

    // Site name, Telegram link and the three ad slots are edited in /admin.

    if (siteSettings) {
      const siteName = clean(siteSettings.siteName);
      if (siteName) SITE_NAME = siteName.slice(0, 60);

      const telegram = clean(siteSettings.telegramUrl);
      if (/^https?:\/\//i.test(telegram)) TELEGRAM_URL = telegram;

      const asCode = (value) => (typeof value === "string" ? value.trim() : "");
      const smartlinkUrl = asCode(siteSettings.adSmartlinkUrl);

      AD_CONFIG.banner.code = asCode(siteSettings.adBannerCode);
      AD_CONFIG.native.code = asCode(siteSettings.adNativeCode);
      AD_CONFIG.smartlink.code = asCode(siteSettings.adSmartlinkCode);
      if (/^https?:\/\//i.test(smartlinkUrl)) AD_CONFIG.smartlink.url = smartlinkUrl;
    }

    // Every tag of a video, as a list. The panel writes them comma separated.
    function splitTags(value) {
      const list = Array.isArray(value) ? value : String(value == null ? "" : value).split(",");
      return list.map((tag) => clean(tag)).filter(Boolean);
    }

    // An API row becomes the same shape videos.js uses.
    function apiRowToVideo(row) {
      if (!row || typeof row !== "object") return null;

      const embedUrl = clean(row.embed_url);
      const videoUrl = clean(row.video_url);

      return {
        id: row.id != null ? `a${row.id}` : null,
        title: row.title,
        creator: row.creator,
        views: row.views,
        duration: clean(row.duration) || formatDuration(Number(row.duration_seconds)),
        durationSeconds: window.VideoRules.seconds(row.duration_seconds) || window.VideoRules.seconds(row.duration),
        tag: row.tag,
        category: clean(row.tag),
        tags: splitTags(row.tags),
        caption: clean(row.caption),
        thumb: row.thumbnail_url,
        url: videoUrl || embedUrl,
        embed: /^https?:\/\//i.test(embedUrl) ? embedUrl : null,
        orientation: row.orientation,
        featured: row.featured === true || row.featured === 1,
        pinned: row.pinned === true || row.pinned === 1,
        posted: postedLabel(row.created_at),
        createdAt: clean(row.created_at),
        source: clean(row.source)
      };
    }

    function postedLabel(value) {
      if (!value) return "";
      const raw = String(value);
      const date = new Date(/[zZ]|[+-]\d{2}:?\d{2}$/.test(raw) ? raw : `${raw.replace(" ", "T")}Z`);
      if (Number.isNaN(date.getTime())) return "";

      const days = Math.floor((Date.now() - date.getTime()) / 86400000);
      if (days <= 0) return "Today";
      if (days === 1) return "Yesterday";
      if (days < 7) return `${days} days ago`;
      if (days < 30) {
        const weeks = Math.floor(days / 7);
        return `${weeks} week${weeks === 1 ? "" : "s"} ago`;
      }
      const months = Math.floor(days / 30);
      return `${months} month${months === 1 ? "" : "s"} ago`;
    }

    function getVideoUrls(url) {
      let originalUrl = null;
      let directUrl = null;

      try {
        const parsedUrl = new URL(url, window.location.href);
        if (parsedUrl.protocol === "https:" || parsedUrl.protocol === "http:") {
          originalUrl = parsedUrl.href;

          // Videy share links -> direct MP4 file.
          if (/(^|\.)videy\.co$/i.test(parsedUrl.hostname) && /^\/v\/?$/.test(parsedUrl.pathname)) {
            const id = parsedUrl.searchParams.get("id");
            if (id && /^[\w-]+$/.test(id)) {
              directUrl = `https://cdn.videy.co/${encodeURIComponent(id)}.mp4`;
            }
          }

          // Any direct .mp4 link also plays in the built-in player.
          if (!directUrl && /\.mp4$/i.test(parsedUrl.pathname)) {
            directUrl = parsedUrl.href;
          }
        }
      } catch (error) {
        // Ignore invalid URLs; those entries are skipped below.
      }

      return { originalUrl, directUrl };
    }

    function normalizeVideo(video, index) {
      if (!video || typeof video !== "object") return null;

      const title = clean(video.title);
      const { originalUrl, directUrl } = getVideoUrls(video.url);
      if (!title || (!originalUrl && !directUrl)) return null;

      const embedUrl = typeof video.embed === "string" && /^https?:\/\//i.test(video.embed)
        ? video.embed
        : null;

      const format = video.format === "short" || video.vertical === true || video.orientation === "vertical"
        ? "short"
        : "landscape";

      return {
        id: video.id || `v${index}`,
        title,
        creator: clean(video.creator),
        views: clean(video.views),
        duration: clean(video.duration) || formatDuration(Number(video.durationSeconds)),
        durationSeconds: window.VideoRules.seconds(video.durationSeconds) || window.VideoRules.seconds(video.duration),
        posted: clean(video.posted || video.ago),
        createdAt: clean(video.createdAt || video.created_at),
        category: clean(video.category),
        tag: clean(video.tag),
        tags: Array.isArray(video.tags) ? video.tags.map((tag) => clean(tag)).filter(Boolean) : [],
        caption: clean(video.caption),
        description: clean(video.description || video.subtitle || video.caption),
        thumb: safeUrl(video.thumb),
        format,
        url: originalUrl || directUrl,
        directUrl,
        embedUrl,
        durationKnown: clean(video.duration),
        featured: Boolean(video.featured),
        pinned: Boolean(video.pinned),
        ratio: 0
      };
    }

    const siteVideos = (Array.isArray(rawVideos) ? rawVideos : [])
      .map(apiLive ? apiRowToVideo : (video) => video)
      .filter(Boolean);

    const VIDEOS = siteVideos.map(normalizeVideo).filter(Boolean);

    const videoKind = (video) => window.VideoRules.kind(video.durationSeconds);
    const isShort = (video) => videoKind(video) === "short";
    const isMovie = (video) => videoKind(video) === "movie";

    /* ================================================================
       HOW RECENT IS A VIDEO
       ----------------------------------------------------------------
       The catalogue hands us a timestamp per row (created_at), and the
       display text ("3 days ago") as a fallback for rows that only
       carry a date. Both are turned into a number so the Up next rail
       can sort by age without inventing anything.
       ================================================================ */
    function videoPublishedAt(video) {
      const raw = String(video.createdAt || "").trim();
      if (raw) {
        const stamp = Date.parse(/[zZ]|[+-]\d{2}:?\d{2}$/.test(raw) ? raw : `${raw.replace(" ", "T")}Z`);
        if (!Number.isNaN(stamp)) return stamp;
      }

      const label = String(video.posted || "").trim().toLowerCase();
      if (!label) return 0;

      const now = Date.now();
      if (label === "today") return now;
      if (label === "yesterday") return now - 86400000;

      const match = /^(\d+)\s*(d|day|days|w|week|weeks|m|mo|month|months)\s*ago$/.exec(label);
      if (match) {
        const amount = Number(match[1]);
        const unit = match[2].charAt(0);
        if (unit === "d") return now - amount * 86400000;
        if (unit === "w") return now - amount * 604800000;
        return now - amount * 2592000000;
      }

      const stamp = Date.parse(label);
      return Number.isNaN(stamp) ? 0 : stamp;
    }

    function videoTags(video) {
      return [...new Set([...(video.tags || []), video.tag].map((tag) => clean(tag)).filter(Boolean))];
    }

    const categories = [...new Set(VIDEOS.flatMap(videoTags).filter((tag) => !/^(all|shorts|movies)$/i.test(tag)))];
    const BY_RECENCY = VIDEOS
      .map((video, index) => ({ video, index, at: videoPublishedAt(video) }))
      .sort((a, b) => (b.at - a.at) || (a.index - b.index))
      .map((entry) => entry.video);
    const PINNED_FIRST = BY_RECENCY.slice().sort((a, b) => Number(Boolean(b.pinned || b.featured)) - Number(Boolean(a.pinned || a.featured)));
    const MOVIES = PINNED_FIRST.filter(isMovie);
    const SHORTS = PINNED_FIRST.filter(isShort);
    const HOME_LATEST = MOVIES.length ? MOVIES : PINNED_FIRST;

    const requestedView = new URLSearchParams(window.location.search).get("view");
    const validViews = new Set(["home", "movies", "shorts", "library"]);
    const view = validViews.has(requestedView) ? requestedView : "home";

    const state = {
      view,
      chip: "All",
      query: ""
    };

    /* ================================================================
       THUMBNAILS (poster frame, lazy + data-saver aware)
       ================================================================ */
    const saveData = () => Boolean(navigator.connection && navigator.connection.saveData);

    const frameObserver = "IntersectionObserver" in window
      ? new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            frameObserver.unobserve(entry.target);
            loadFirstFrame(entry.target);
          });
        }, { rootMargin: "320px 0px" })
      : null;

    function markReady(posterNode) {
      if (!posterNode) return;
      posterNode.classList.add("has-media");
    }

    function loadFirstFrame(media) {
      const video = media.querySelector?.("video[data-src]");
      if (video) {
        video.src = video.dataset.src;
        delete video.dataset.src;
      }
    }

    function watchFrame(media, eager) {
      if (eager || !frameObserver) loadFirstFrame(media);
      else frameObserver.observe(media);
    }

    function attachMedia(posterButton, video, { eager = false } = {}) {
      const posterNode = posterButton.closest(".poster");
      if (!posterNode) return;

      if (video.thumb) {
        const image = document.createElement("img");
        image.className = "poster__media";
        image.alt = "";
        image.decoding = "async";
        image.loading = eager ? "eager" : "lazy";
        if (eager) image.fetchPriority = "high";
        image.src = video.thumb;
        image.addEventListener("load", () => {
          applyNaturalRatio(posterNode, video, image.naturalWidth, image.naturalHeight);
          markReady(posterNode);
        }, { once: true });
        image.addEventListener("error", () => {
          image.remove();
          addFrameVideo(posterButton, video, eager);
        }, { once: true });
        posterButton.append(image);
        return;
      }

      addFrameVideo(posterButton, video, eager);
    }

    function addFrameVideo(posterButton, video, eager) {
      const posterNode = posterButton.closest(".poster");
      if (!posterNode || !video.directUrl) return;

      // On metered connections the gradient artwork stands in for the frame.
      if (saveData() && !eager) return;

      const frame = document.createElement("video");
      frame.className = "poster__media";
      frame.muted = true;
      frame.defaultMuted = true;
      frame.playsInline = true;
      frame.preload = "metadata";
      frame.tabIndex = -1;
      frame.setAttribute("aria-hidden", "true");
      frame.dataset.src = `${video.directUrl}#t=1`;
      posterButton.append(frame);

      const ready = () => markReady(posterNode);
      frame.addEventListener("loadeddata", ready, { once: true });
      frame.addEventListener("seeked", ready, { once: true });
      frame.addEventListener("loadedmetadata", () => {
        applyNaturalRatio(posterNode, video, frame.videoWidth, frame.videoHeight);
        if (frame.duration > 0.6) frame.currentTime = 0.5;
      }, { once: true });
      frame.addEventListener("error", () => frame.remove(), { once: true });

      watchFrame(posterButton, eager);
    }

    /* ================================================================
       POSTER / CARD MARKUP
       ================================================================ */
    function createPoster(video, { variant = "card", eager = false } = {}) {
      const wrap = document.createElement("div");
      wrap.className = `poster poster--${variant}`;
      wrap.style.setProperty("--tone", tone(Number(String(video.id).replace(/\D/g, "")) || 0));
      const defaultRatio = video.ratio || (video.format === "short" ? 9 / 16 : 16 / 9);
      wrap.style.setProperty("--ar", String(defaultRatio));

      const duration = video.duration || (video.durationSeconds ? formatDuration(video.durationSeconds) : "—");
      const link = document.createElement("a");
      link.className = "poster__btn";
      link.href = watchUrl(video);
      link.setAttribute("aria-label", `Watch ${video.title}`);
      link.innerHTML = [
        '<span class="poster__art" aria-hidden="true"></span>',
        '<span class="poster__shade" aria-hidden="true"></span>',
        isShort(video) ? '<span class="poster__short">Short</span>' : "",
        `<span class="poster__dur" data-duration-for="${esc(video.id)}">${esc(duration)}</span>`,
        `<span class="poster__play" aria-hidden="true">${svg("play", "icon icon--fill")}</span>`
      ].join("");

      wrap.append(link);
      attachMedia(link, video, { eager });
      return wrap;
    }

    function createVideoCard(video, { variant = "masonry", eager = false } = {}) {
      const card = document.createElement("article");
      card.className = `media-card video-card ${variant === "movie" ? "movie-card" : "masonry-card"}`;
      card.append(createPoster(video, { variant: "card", eager }));

      const body = document.createElement("div");
      body.className = "card__body";
      body.innerHTML = [
        `<h3 class="card__title"><a href="${esc(watchUrl(video))}">${esc(video.title)}</a></h3>`,
        `<p class="card__meta">${esc(video.views || "0")} views</p>`
      ].join("");
      card.append(body);
      return card;
    }

    /* ================================================================
       ADVERTISEMENTS — every slot is built from AD_CONFIG
       ================================================================ */
    const adCode = (value) => (typeof value === "string" ? value.trim() : "");
    const adLabel = (slot) => (slot && slot.label) || "Advertisement";

    const adUrl = (value) => {
      try {
        const parsed = new URL(String(value || "").trim());
        return ["http:", "https:"].includes(parsed.protocol) ? parsed.href : "";
      } catch (error) {
        return "";
      }
    };

    // Scripts inserted with innerHTML never execute. Re-create them once the
    // slot is close to the viewport, which is what keeps ad code lazy.
    function runAdScripts(frame) {
      frame.querySelectorAll("script").forEach((stale) => {
        const script = document.createElement("script");
        for (const attribute of stale.attributes) script.setAttribute(attribute.name, attribute.value);
        script.textContent = stale.textContent;
        stale.replaceWith(script);
      });
    }

    const adObserver = "IntersectionObserver" in window
      ? new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            adObserver.unobserve(entry.target);
            runAdScripts(entry.target);
          });
        }, { rootMargin: "300px 0px" })
      : null;

    function startAd(frame) {
      if (!frame) return;
      if (adObserver) adObserver.observe(frame);
      else runAdScripts(frame);
    }

    function createAdCard(slot, code) {
      const card = document.createElement("article");
      card.className = "ad-card";

      const label = document.createElement("span");
      label.className = "ad-card__label";
      label.textContent = adLabel(slot);

      const frame = document.createElement("div");
      frame.className = "ad-card__frame";
      frame.innerHTML = code;

      card.append(label, frame);
      startAd(frame);
      return card;
    }

    function createNativeAdCard() {
      const slot = AD_CONFIG.native || {};
      const code = adCode(slot.code);
      return code ? createAdCard(slot, code) : null;
    }

    function createSmartlinkCard() {
      const slot = AD_CONFIG.smartlink || {};
      const code = adCode(slot.code);
      const href = adUrl(slot.url);
      if (!code && !href) return null;
      if (code) return createAdCard(slot, code);

      const card = document.createElement("article");
      card.className = "sponsored-card";
      card.innerHTML = `
        <a class="sponsored-card__link" href="${esc(href)}" target="_blank" rel="noopener sponsored">
          <span>
            <span class="sponsored-label">${esc(adLabel(slot))} · Exclusive</span>
            <span class="sponsored-card__title">A private offer, selected for you.</span>
            <span class="sponsored-card__description">Discover the featured promotion. This clearly marked sponsored placement is separate from the video library.</span>
          </span>
          <span class="sponsored-card__cta">Explore offer
            <svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          </span>
        </a>`;
      return card;
    }

    // (a) Banner between Shorts and Trending. Hidden when no code is configured.
    function mountBannerAd() {
      const container = $("#ad-banner");
      if (!container) return;
      const slot = AD_CONFIG.banner || {};
      const code = adCode(slot.code);

      if (!code) {
        container.hidden = true;
        container.replaceChildren();
        return;
      }

      const label = document.createElement("span");
      label.className = "ad-slot__label";
      label.textContent = adLabel(slot);

      const frame = document.createElement("div");
      frame.className = "ad-slot__frame";
      frame.innerHTML = code;

      container.replaceChildren(label, frame);
      container.hidden = false;
      startAd(frame);
    }

    /* ================================================================
       MASONRY / NATURAL-RATIO GRIDS
       ================================================================ */
    const masonryMobile = window.matchMedia("(max-width: 767px)");

    function masonryColumnCount(grid) {
      if (grid.classList.contains("grid-shorts")) return masonryMobile.matches ? 2 : 4;
      return masonryMobile.matches ? 2 : 4;
    }

    function masonryGap(grid) {
      const value = parseFloat(getComputedStyle(grid).columnGap);
      return Number.isFinite(value) ? value : 16;
    }

    function estimatedCardHeight(card, columnWidth, mobile) {
      if (card.classList.contains("sponsored-card") || card.classList.contains("ad-card")) return mobile ? 190 : 230;
      const poster = card.querySelector(".poster");
      const ratio = parseFloat(poster && poster.style.getPropertyValue("--ar"));
      return columnWidth / (Number.isFinite(ratio) && ratio > 0 ? ratio : 16 / 9) + (mobile ? 48 : 58);
    }

    function distributeMasonry(grid) {
      const cards = grid._masonryCards;
      if (!grid.classList.contains("masonry-grid") || !cards || !cards.length) return;
      const cols = masonryColumnCount(grid);
      const gap = masonryGap(grid);
      const mobile = masonryMobile.matches;
      const width = grid.clientWidth;
      const columnWidth = width ? Math.max(80, (width - gap * (cols - 1)) / cols) : (mobile ? 140 : 300);
      grid.replaceChildren();

      const columns = [];
      const estimated = [];
      for (let index = 0; index < cols; index += 1) {
        const column = document.createElement("div");
        column.className = "masonry__col";
        grid.append(column);
        columns.push(column);
        estimated.push(0);
      }
      const measurable = width > 0 && grid.offsetParent !== null;
      cards.forEach((card) => {
        let target = 0;
        for (let index = 1; index < cols; index += 1) {
          const current = measurable ? columns[target].offsetHeight : estimated[target];
          const candidate = measurable ? columns[index].offsetHeight : estimated[index];
          if (candidate < current) target = index;
        }
        columns[target].append(card);
        estimated[target] += estimatedCardHeight(card, columnWidth, mobile) + gap;
      });
      grid.dataset.masonryCols = String(cols);
    }

    let masonryTimer = 0;
    function scheduleMasonryReflow() {
      window.clearTimeout(masonryTimer);
      masonryTimer = window.setTimeout(() => {
        document.querySelectorAll(".masonry-grid").forEach(distributeMasonry);
      }, 100);
    }

    function applyNaturalRatio(posterNode, video, width, height) {
      if (!posterNode || !width || !height) return;
      const ratio = width / height;
      if (!Number.isFinite(ratio) || ratio <= 0) return;
      if (video && video.format === "short" && width >= height) return;
      const rounded = Number(ratio.toFixed(4));
      if (video) video.ratio = rounded;
      posterNode.style.setProperty("--ar", String(rounded));
      if (posterNode.closest(".masonry-grid")) scheduleMasonryReflow();
    }

    window.addEventListener("resize", scheduleMasonryReflow);

    function appendVideoBatch(grid, items, { variant = "masonry", native = false, final = false } = {}) {
      if (!grid._masonryCards) grid._masonryCards = [];
      const additions = [];
      const offset = grid._videoCount || 0;
      const every = Math.max(1, Number(AD_CONFIG.native && AD_CONFIG.native.every) || 8);

      items.forEach((video, index) => {
        const card = createVideoCard(video, { variant, eager: offset + index < 2 });
        additions.push(card);
        if (native && !grid._nativeInserted && (offset + index + 1) % every === 0) {
          const ad = createNativeAdCard();
          if (ad) { additions.push(ad); grid._nativeInserted = true; }
        }
      });

      grid._videoCount = offset + items.length;
      if (native && final && grid._videoCount) {
        if (!grid._nativeInserted) {
          const ad = createNativeAdCard();
          if (ad) { additions.push(ad); grid._nativeInserted = true; }
        }
        if (!grid._smartlinkInserted) {
          const smartlink = createSmartlinkCard();
          if (smartlink) { additions.push(smartlink); grid._smartlinkInserted = true; }
        }
      }

      if (grid.classList.contains("masonry-grid")) {
        grid._masonryCards.push(...additions);
        distributeMasonry(grid);
      } else {
        grid.append(...additions);
      }
    }

    function fillGrid(grid, items, options = {}) {
      grid.replaceChildren();
      grid._masonryCards = [];
      grid._videoCount = 0;
      grid._nativeInserted = false;
      grid._smartlinkInserted = false;
      appendVideoBatch(grid, items, { ...options, final: true });
    }

    function watchUrl(video) {
      if (!video) return "/";
      const id = String(video.id || "");
      const key = id.replace(/^a/, "") || id;
      return `/watch?v=${encodeURIComponent(key)}`;
    }

    /* ================================================================
       CATALOGUE FILTERS, HOME SHELVES AND INFINITE SCROLL
       ================================================================ */
    const PAGE_SIZE = 12;
    const chipsShell = $(".chips-shell");
    const loadSentinel = $("#load-sentinel");
    let pager = null;
    let loadObserver = null;

    if ("IntersectionObserver" in window) {
      loadObserver = new IntersectionObserver((entries) => {
        if (entries.some((entry) => entry.isIntersecting)) loadNextPage();
      }, { rootMargin: "500px 0px" });
    }

    function matchesFilter(video) {
      const query = state.query.trim().toLowerCase();
      const chip = state.chip;
      if (chip === "Shorts" && !isShort(video)) return false;
      if (chip === "Movies" && !isMovie(video)) return false;
      if (chip !== "All" && chip !== "Shorts" && chip !== "Movies" &&
          !videoTags(video).some((tag) => tag.toLowerCase() === chip.toLowerCase())) return false;
      if (!query) return true;
      const haystack = [video.title, video.creator, video.category, video.tag, ...videoTags(video), video.description]
        .filter(Boolean).join(" ").toLowerCase();
      return haystack.includes(query);
    }

    function setActiveView(viewName) {
      document.querySelectorAll("[data-view-link]").forEach((link) => {
        const active = link.dataset.viewLink === viewName;
        link.classList.toggle("is-active", active);
        if (active) link.setAttribute("aria-current", "page");
        else link.removeAttribute("aria-current");
      });
    }

    function renderChips() {
      const bar = $("#chips");
      if (chipsShell) chipsShell.hidden = state.view !== "home";
      const labels = ["All", "Shorts", "Movies", ...categories];
      bar.replaceChildren();
      labels.forEach((label) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        chip.dataset.chip = label;
        chip.textContent = label;
        const active = state.chip.toLowerCase() === label.toLowerCase();
        chip.classList.toggle("is-active", active);
        chip.setAttribute("aria-pressed", String(active));
        bar.append(chip);
      });
    }

    function renderDrawerCategories() {
      const list = $("#drawer-categories");
      const title = $(".drawer-title");
      list.replaceChildren();
      list.hidden = categories.length === 0;
      if (title) title.hidden = categories.length === 0;
      categories.forEach((tag) => {
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.drawerTag = tag;
        button.textContent = tag;
        list.append(button);
      });
    }

    function setGridVariant(grid, variant) {
      grid.classList.toggle("grid-latest", variant === "movie");
      grid.classList.toggle("grid-shorts", variant === "shorts");
      grid.classList.toggle("masonry-grid", variant !== "movie");
    }

    function showPaginatedGrid(grid, items, { variant = "masonry", native = false } = {}) {
      if (loadObserver && loadSentinel) loadObserver.unobserve(loadSentinel);
      setGridVariant(grid, variant);
      grid.replaceChildren();
      grid._masonryCards = [];
      grid._videoCount = 0;
      grid._nativeInserted = false;
      grid._smartlinkInserted = false;
      pager = { grid, items, variant, native, cursor: 0, loading: false };
      loadSentinel.hidden = true;
      loadNextPage();
    }

    function loadNextPage() {
      if (!pager || pager.loading) return;
      pager.loading = true;
      const next = pager.items.slice(pager.cursor, pager.cursor + PAGE_SIZE);
      pager.cursor += next.length;
      const final = pager.cursor >= pager.items.length;
      if (next.length) appendVideoBatch(pager.grid, next, { variant: pager.variant, native: pager.native, final });
      const more = pager.cursor < pager.items.length;
      loadSentinel.hidden = !more;
      if (more && loadObserver) loadObserver.observe(loadSentinel);
      pager.loading = false;
      scheduleMasonryReflow();
      if (more && !loadObserver) window.requestAnimationFrame(checkSentinel);
    }

    function checkSentinel() {
      if (!pager || loadSentinel.hidden || pager.loading) return;
      if (loadSentinel.getBoundingClientRect().top <= window.innerHeight + 500) loadNextPage();
    }

    if (!loadObserver) {
      let checkFrame = 0;
      window.addEventListener("scroll", () => {
        if (checkFrame) return;
        checkFrame = window.requestAnimationFrame(() => {
          checkFrame = 0;
          checkSentinel();
        });
      }, { passive: true });
    }

    function renderPage() {
      setActiveView(state.view);
      renderChips();
      const shortsSection = $("#shorts-section");
      const latestSection = $("#latest-section");
      const filteredSection = $("#filtered-section");
      const catalogueSection = $("#catalogue-section");
      const empty = $("#catalogue-empty");
      const banner = $("#ad-banner");
      if (loadObserver && loadSentinel) loadObserver.unobserve(loadSentinel);
      pager = null;
      loadSentinel.hidden = true;
      empty.hidden = true;
      shortsSection.hidden = true;
      latestSection.hidden = true;
      filteredSection.hidden = true;
      catalogueSection.hidden = true;

      if (state.view === "home") {
        const isFiltered = state.chip !== "All" || Boolean(state.query.trim());
        if (!isFiltered) {
          const shorts = SHORTS.slice(0, 8);
          if (shorts.length) {
            shortsSection.hidden = false;
            fillGrid($("#shorts-grid"), shorts, { variant: "shorts" });
          }
          mountBannerAd();
          const latest = HOME_LATEST;
          if (latest.length) {
            latestSection.hidden = false;
            showPaginatedGrid($("#latest-grid"), latest, { variant: "movie", native: true });
          }
          if (!shorts.length && !latest.length) {
            empty.textContent = "No videos yet.";
            empty.hidden = false;
          }
          return;
        }

        banner.hidden = true;
        const items = PINNED_FIRST.filter(matchesFilter);
        if (!items.length) {
          empty.textContent = "No videos match this filter.";
          empty.hidden = false;
          return;
        }
        const variant = state.chip === "Movies" ? "movie" : state.chip === "Shorts" ? "shorts" : "masonry";
        filteredSection.hidden = false;
        $("#filtered-title").textContent = state.query.trim() ? "Search results" : state.chip;
        showPaginatedGrid($("#filtered-grid"), items, { variant });
        return;
      }

      banner.hidden = true;
      const items = state.view === "movies" ? MOVIES : state.view === "shorts" ? SHORTS : PINNED_FIRST;
      const title = state.view === "library" ? "Full library" : state.view === "movies" ? "Movies" : "Shorts";
      $("#catalogue-title").textContent = title;
      if (state.query.trim()) {
        const query = state.query.trim().toLowerCase();
        const searchable = items.filter((video) => [video.title, video.creator, video.description, ...videoTags(video)].filter(Boolean).join(" ").toLowerCase().includes(query));
        if (!searchable.length) {
          empty.textContent = "No videos match your search.";
          empty.hidden = false;
          return;
        }
        catalogueSection.hidden = false;
        showPaginatedGrid($("#catalogue-grid"), searchable, { variant: state.view === "movies" ? "movie" : state.view === "shorts" ? "shorts" : "masonry", native: state.view === "movies" });
        return;
      }
      if (!items.length) {
        empty.textContent = `No ${title.toLowerCase()} yet.`;
        empty.hidden = false;
        return;
      }
      catalogueSection.hidden = false;
      showPaginatedGrid($("#catalogue-grid"), items, { variant: state.view === "movies" ? "movie" : state.view === "shorts" ? "shorts" : "masonry", native: state.view === "movies" });
    }

    /* ================================================================
       TELEGRAM + SMARTLINK + SOCIALS
       ================================================================ */
    const telegramConfigured = /^https?:\/\//i.test(TELEGRAM_URL.trim());

    // Attributes only (no listeners), so it can safely run after every re-render.
    function applyTelegramLinks() {
      document.querySelectorAll("[data-telegram]").forEach((link) => {
        if (telegramConfigured) {
          link.href = TELEGRAM_URL.trim();
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.classList.remove("is-unconfigured");
          link.removeAttribute("aria-disabled");
          link.removeAttribute("title");
        } else {
          link.href = "#telegram";
          link.classList.add("is-unconfigured");
          link.setAttribute("aria-disabled", "true");
          link.title = "Add your Telegram link to TELEGRAM_URL in index.html to activate this button.";
        }
      });
    }

    /* ================================================================
       NAV / SEARCH / MENU
       ================================================================ */
    function syncSearchInputs(value) {
      ["#search-input", "#search-input-mobile"].forEach((selector) => {
        const input = $(selector);
        if (input && input.value !== value) input.value = value;
      });
    }

    let searchTimer = 0;

    function handleSearch(value) {
      state.query = value;
      syncSearchInputs(value);
      renderPage();
      clearTimeout(searchTimer);
      searchTimer = window.setTimeout(() => {
        const section = state.view === "home" && state.chip === "All" && !state.query.trim()
          ? $("#latest-section")
          : state.view === "home" ? $("#filtered-section") : $("#catalogue-section");
        if (!section || section.hidden) return;
        const rect = section.getBoundingClientRect();
        if (rect.top < 0) window.scrollTo({ top: rect.top + window.scrollY - 76, behavior: "smooth" });
      }, 350);
    }

    function closeMenu() {
      const toggle = $(".menu-toggle");
      const drawer = $("#site-drawer");
      const overlay = $("#drawer-overlay");
      if (!toggle || !drawer || !overlay) return;
      toggle.setAttribute("aria-expanded", "false");
      toggle.setAttribute("aria-label", "Open menu");
      drawer.classList.remove("is-open");
      drawer.setAttribute("aria-hidden", "true");
      drawer.inert = true;
      overlay.classList.remove("is-open");
      document.body.classList.remove("drawer-open");
    }

    function setupMenu() {
      const toggle = $(".menu-toggle");
      const drawer = $("#site-drawer");
      const overlay = $("#drawer-overlay");
      const open = () => {
        toggle.setAttribute("aria-expanded", "true");
        toggle.setAttribute("aria-label", "Close menu");
        drawer.classList.add("is-open");
        drawer.setAttribute("aria-hidden", "false");
        drawer.inert = false;
        overlay.classList.add("is-open");
        document.body.classList.add("drawer-open");
      };
      toggle.addEventListener("click", () => {
        if (toggle.getAttribute("aria-expanded") === "true") closeMenu();
        else open();
      });
      $(".drawer-close").addEventListener("click", closeMenu);
      overlay.addEventListener("click", closeMenu);
      drawer.querySelectorAll("a[data-view-link], a[data-telegram]").forEach((link) => link.addEventListener("click", closeMenu));
      drawer.addEventListener("click", (event) => {
        const tagButton = event.target.closest("[data-drawer-tag]");
        if (!tagButton) return;
        event.preventDefault();
        state.view = "home";
        state.chip = tagButton.dataset.drawerTag;
        state.query = "";
        syncSearchInputs("");
        history.replaceState(history.state, "", "/");
        closeMenu();
        renderPage();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeMenu();
      });
    }

    function setupSearch() {
      $("#search-input")?.addEventListener("input", (event) => handleSearch(event.target.value));
      $("#search-input-mobile")?.addEventListener("input", (event) => handleSearch(event.target.value));

      const toggle = $(".search-toggle");
      const panel = $("#search-mobile");
      toggle?.addEventListener("click", () => {
        const open = toggle.getAttribute("aria-expanded") === "true";
        toggle.setAttribute("aria-expanded", String(!open));
        panel.hidden = open;
        if (!open) $("#search-input-mobile")?.focus();
      });

      document.querySelectorAll(".search").forEach((form) => {
        form.addEventListener("submit", (event) => event.preventDefault());
      });
    }

    /* ================================================================
       EVENTS
       ================================================================ */
    function setupEvents() {
      document.addEventListener("click", (event) => {
        const target = event.target;
        const telegramLink = target.closest("[data-telegram]");
        if (telegramLink) {
          if (!telegramConfigured) {
            event.preventDefault();
            toast("Telegram link coming soon");
          }
          return;
        }

        const chip = target.closest("[data-chip]");
        if (chip) {
          state.chip = chip.dataset.chip;
          renderPage();
          return;
        }

        if (target.closest("[data-clear-filter]")) {
          state.chip = "All";
          state.query = "";
          syncSearchInputs("");
          renderPage();
          return;
        }
      });
    }

    /* Top navigation and mobile tabs share the current type-filtered view. */
    setActiveView(state.view);

    /* ================================================================
       THEME (dark default, saved choice, device preference on first visit)
       ================================================================ */
    const THEME_KEY = "theme";
    const themeRoot = document.documentElement;
    let themeTimer = 0;

    function storedTheme() {
      try {
        const saved = localStorage.getItem(THEME_KEY);
        return saved === "light" || saved === "dark" ? saved : null;
      } catch (error) {
        return null;
      }
    }

    function prefersLight() {
      return Boolean(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
    }

    function applyTheme(theme, { persist = false, animate = false } = {}) {
      const next = theme === "light" ? "light" : "dark";
      const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (animate && !reduceMotion) {
        themeRoot.classList.add("is-theming");
        clearTimeout(themeTimer);
        themeTimer = window.setTimeout(() => themeRoot.classList.remove("is-theming"), 340);
      }

      themeRoot.setAttribute("data-theme", next);

      if (persist) {
        try { localStorage.setItem(THEME_KEY, next); } catch (error) { /* private mode */ }
      }

      const themeColor = document.querySelector('meta[name="theme-color"]');
      if (themeColor) themeColor.setAttribute("content", next === "light" ? "#F7F7FA" : "#0B0B0F");

      const label = `Switch to ${next === "light" ? "dark" : "light"} mode`;
      document.querySelectorAll("[data-theme-toggle]").forEach((button) => {
        button.setAttribute("aria-label", label);
        button.setAttribute("title", label);
      });
      document.querySelectorAll("[data-theme-action-label]").forEach((node) => {
        node.textContent = label;
      });
    }

    function setupTheme() {
      applyTheme(themeRoot.getAttribute("data-theme") || storedTheme() || (prefersLight() ? "light" : "dark"));

      document.querySelectorAll("[data-theme-toggle]").forEach((button) => {
        button.addEventListener("click", () => {
          const next = themeRoot.getAttribute("data-theme") === "light" ? "dark" : "light";
          applyTheme(next, { persist: true, animate: true });
          closeMenu();
        });
      });

      // Follow the device setting until the visitor makes an explicit choice.
      if (window.matchMedia) {
        const query = window.matchMedia("(prefers-color-scheme: light)");
        const followSystem = (event) => {
          if (!storedTheme()) applyTheme(event.matches ? "light" : "dark", { animate: true });
        };
        if (query.addEventListener) query.addEventListener("change", followSystem);
        else if (query.addListener) query.addListener(followSystem);
      }

      // Warm the other logo variant when the browser is idle so the swap is instant.
      const warm = window.requestIdleCallback || ((callback) => window.setTimeout(callback, 1400));
      warm(() => {
        const other = new Image();
        other.src = themeRoot.getAttribute("data-theme") === "light"
          ? "./assets/logo-lockup@3x.png"
          : "./assets/logo-lockup-light@3x.png";
      });
    }

    /* ================================================================
       BRANDING SYNC + BOOT
       ================================================================ */
    function syncBranding() {
      document.querySelectorAll("[data-site-name]").forEach((node) => {
        node.textContent = SITE_NAME;
      });

      const suffix = " | Curated Video Entertainment";
      document.title = `${SITE_NAME}${suffix}`;
      document.querySelector('meta[name="author"]')?.setAttribute("content", SITE_NAME);
      document.querySelector('meta[name="description"]')?.setAttribute(
        "content",
        `${SITE_NAME} is a home for curated Movies, Shorts, and video picks.`
      );
      document.querySelector('meta[property="og:site_name"]')?.setAttribute("content", SITE_NAME);
      document.querySelector('meta[property="og:title"]')?.setAttribute("content", `${SITE_NAME}${suffix}`);
      document.querySelector('meta[property="og:description"]')?.setAttribute(
        "content",
        `Explore Movies, Shorts, and the latest videos at ${SITE_NAME}.`
      );
      document.querySelector('meta[name="twitter:title"]')?.setAttribute("content", `${SITE_NAME}${suffix}`);
      document.querySelector('meta[name="twitter:description"]')?.setAttribute(
        "content",
        `Explore Movies, Shorts, and the latest videos at ${SITE_NAME}.`
      );

      const brandLink = $(".brand");
      brandLink?.setAttribute("aria-label", `${SITE_NAME} home`);
      const year = $("#current-year");
      if (year) year.textContent = String(new Date().getFullYear());
    }

    syncBranding();
    setupTheme();
    renderDrawerCategories();
    applyTelegramLinks();
    setupMenu();
    setupSearch();
    setupEvents();
    renderPage();

  </script>
</body>
</html>
