# ---------------------------------------------------------------------------
# Cloudflare Pages configuration for the admin (Functions + D1 + R2).
#
# HOW THIS PROJECT IS CONFIGURED  (read this before editing)
# ----------------------------------------------------------
# This repo is built by Cloudflare Pages from GitHub and its D1 / R2 bindings
# are created in the dashboard (Pages project → Settings → Bindings), exactly as
# SETUP.md walks through.
#
# `pages_build_output_dir` is therefore DELIBERATELY NOT SET. Per Cloudflare's
# docs, adding that key makes this file the "source of truth" for the project
# and the dashboard bindings stop being applied — the Functions then run without
# `env.DB` / `env.MEDIA`, and `/admin` sign-in answers 500. With the key absent,
# Pages ignores this file (it logs a harmless "skipping file" warning) and the
# dashboard bindings apply.
#
# Secrets (ADMIN_PASSWORD, SESSION_SECRET, bot token…) always live in the
# dashboard, never in this file.
#
# OPTIONAL — configuration-as-code
# --------------------------------
# If you would rather version your bindings, then uncomment BOTH the
# `pages_build_output_dir` line AND the binding blocks below with your real ids
# (`npx wrangler d1 list` / `npx wrangler r2 bucket list`). Uncommenting the key
# without the bindings breaks the deployment. Never ship one without the other.
# ---------------------------------------------------------------------------

name = "ceejaydavicks-github-io"
compatibility_date = "2025-09-01"

# pages_build_output_dir = "."

# [[d1_databases]]
# binding = "DB"
# database_name = "bootymansion"
# database_id = "PASTE_YOUR_DATABASE_ID_HERE"
#
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "bootymansion-media"

# Plain-text variables can live here; secrets belong in .dev.vars (local) or in
# the dashboard (production).
#
# [vars]
# ADMIN_TELEGRAM_IDS = "123456789"
#
# Optional — scraped links (the bot's automatic path):
#   SCRAPE_MIRROR_MAX_MB = "90"   largest scraped file copied into R2
#   SCRAPE_MIRROR = "off"         never copy scraped files, only thumbnails
#   SCRAPE_ALLOW_PAGE = "on"      also publish pages whose player could not be read

# Local development only:
#   npx wrangler pages dev . --d1 DB --r2 MEDIA
# (the leading `.` is the static output directory; it is optional when
# `pages_build_output_dir` above is enabled).
